    <script>
      // Google Consent Mode v2 — varsayılan REDDEDİLMİŞ.
      // Reklam betiği yüklenmeden önce çalışmalı, bu yüzden burada ve satır içi.
      window.dataLayer = window.dataLayer || []
      function gtag() { dataLayer.push(arguments) }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500,
      })
      try {
        if (localStorage.getItem('ka:reklam-onayi') === 'izin') {
          gtag('consent', 'update', {
            ad_storage: 'granted',
            ad_user_data: 'granted',
            ad_personalization: 'granted',
          })
        }
      } catch (e) {}
    </script>
    <script>
      // Tema flaşını önle
      (function () {
        try {
          var t = localStorage.getItem('ka:theme');
          var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <!-- Vercel Web Analytics + Speed Insights.
         Paket kurmaya gerek yok; Vercel bu iki yolu kendi sunuyor.

         DİKKAT: Panelde Analytics KAPALIYSA /_vercel/... diye bir dosya olmaz,
         istek SPA yeniden yazma kuralına düşer ve index.html döner. Tarayıcı
         HTML'i JavaScript sanıp her sayfada
         "Uncaught SyntaxError: Unexpected token '<'" basar. Bu yüzden betik
         doğrudan eklenmiyor: önce içerik türü doğrulanıyor, gerçekten
         JavaScript ise sayfaya konuyor. Panelde açılınca kendiliğinden
         devreye girer, kapalıyken tek bir hata bile üretmez.

         Çerez KULLANMAZ, kişisel veri toplamaz — çerez iznine bağlı değil. -->
    <script>
      (function () {
        ;['insights', 'speed-insights'].forEach(function (ad) {
          var yol = '/_vercel/' + ad + '/script.js'
          fetch(yol, { cache: 'force-cache' })
            .then(function (y) {
              if (!y.ok) return
              if ((y.headers.get('content-type') || '').indexOf('javascript') < 0) return
              var e = document.createElement('script')
              e.defer = true
              e.src = yol
              document.head.appendChild(e)
            })
            .catch(function () {})
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
